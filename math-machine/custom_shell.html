<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}
body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
}
#canvas:focus {
	outline: none;
}
#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}
#status, #status-splash {
	top: 0;
	bottom: 0;
}
#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}
#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}
#status-splash.show-image--false {
	display: none;
}
#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}
#status-splash.use-filter--false {
	image-rendering: pixelated;
}
#status-progress, #status-notice {
	display: none;
}
#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}
#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<noscript>
			Your browser does not support JavaScript.
		</noscript>
		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		<script src="$GODOT_URL"></script>

		<!-- ByteBrew Web SDK: bundled by addons/bytebrew_web_export (see its README.md).
		     This plain script tag works because the export plugin copies
		     bytebrew.bundle.js next to this file during every Web export. -->
		<script src="bytebrew.bundle.js"></script>
		<script>
			// Bind initialization and tracking methods globally onto the window object
			window.initByteBrew = function(appId, sdkKey, appVersion) {
				try {
					// Replace with your Web platform specific keys from the ByteBrew Dashboard
					window.ByteBrewSDK.ByteBrew.initializeByteBrew(appId, sdkKey, appVersion);
					console.log("ByteBrew JS SDK initialized successfully.");
				} catch (e) {
					console.error("Failed to initialize ByteBrew:", e);
				}
			};

			window.trackCustomEvent = function(eventName, parametersJSON) {
				try {
					// Parse parameters passed from Godot as a JSON string
					const params = parametersJSON ? JSON.parse(parametersJSON) : {};
					window.ByteBrewSDK.ByteBrew.newCustomEvent(eventName, params);
				} catch (e) {
					console.error("Failed to track ByteBrew event:", e);
				}
			};
		</script>
		<script>
			// Godot assigns window.onGameFlushSave once the engine boots (see
			// SaveManager._ready()). We just need to call it at the right moments -
			// checking it exists handles the brief window before the engine is up.
			function flushGameSave() {
				if (window.onGameFlushSave) {
					window.onGameFlushSave();
				}
			}

			// Primary signal: tab hidden, backgrounded, or navigated away from.
			// This is the one Chrome's own guidance recommends over beforeunload,
			// which can disable the back/forward cache and isn't reliably fired on
			// mobile when the browser just suspends the app instead of closing it.
			document.addEventListener('visibilitychange', function () {
				if (document.visibilityState === 'hidden') {
					flushGameSave();
				}
			});

			// Fallback for cases visibilitychange can miss (e.g. some in-app
			// browsers). Unlike beforeunload, pagehide doesn't hurt bfcache.
			window.addEventListener('pagehide', flushGameSave);
		</script>

		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

// --- CrazyGames-safe canvas scaler -----------------------------------------
// GODOT_CONFIG.canvasResizePolicy MUST be 0 (None) in the export preset for
// this to work. With policy 0, Godot never recomputes canvas.width/height
// itself - it just reconfigures its GL viewport to match whatever size we
// set here. That lets us drive the canvas from the ACTUAL rendered size
// (via getBoundingClientRect, which reflects any ancestor CSS scaling a
// host page/iframe applies, e.g. CrazyGames' portal) instead of
// window.innerWidth/innerHeight, which only reflects this document's own
// viewport and is blind to that kind of ancestor-level scaling.
//
// CRASH FIX (2026-08-30): this used to size the canvas backing store to
// rect size x devicePixelRatio with NO ceiling. That's harmless on a phone
// (viewport is small and fixed), but on desktop a maximized window on a
// big/high-DPI monitor can ask for a multi-thousand-pixel-per-side
// framebuffer, which is the leading suspect for our desktop-only crash
// spike (WebGL/GPU driver failures scale with framebuffer size). We now
// cap both the effective DPR and the backing-store's long edge, and
// coalesce bursts of resize events (e.g. dragging a window edge) onto a
// single rAF tick instead of resizing on every single event.
(function () {
	const canvas = document.getElementById('canvas');

	// Tune these if the game looks soft on big desktop displays, but keep
	// in mind raising them directly increases GPU memory / framebuffer
	// size on exactly the platform that's been crashing.
	const MAX_DPR = 2;
	const MAX_LONG_EDGE = 1920; // backing-store px, not CSS px

	function resizeCanvasToDisplaySize() {
		const rect = canvas.getBoundingClientRect();
		const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
		let width = Math.max(1, Math.round(rect.width * dpr));
		let height = Math.max(1, Math.round(rect.height * dpr));

		const longEdge = Math.max(width, height);
		if (longEdge > MAX_LONG_EDGE) {
			const scale = MAX_LONG_EDGE / longEdge;
			width = Math.max(1, Math.round(width * scale));
			height = Math.max(1, Math.round(height * scale));
		}

		if (canvas.width !== width || canvas.height !== height) {
			canvas.width = width;
			canvas.height = height;
		}
	}

	let resizeScheduled = false;
	function scheduleResize() {
		if (resizeScheduled) {
			return;
		}
		resizeScheduled = true;
		requestAnimationFrame(function () {
			resizeScheduled = false;
			resizeCanvasToDisplaySize();
		});
	}

	// Run once immediately, before engine.startGame() reads the canvas size.
	resizeCanvasToDisplaySize();

	// Event-driven: fires immediately on real layout changes, coalesced to
	// at most once per animation frame so a window-drag resize doesn't
	// thrash the GL framebuffer dozens of times per second.
	window.addEventListener('resize', scheduleResize);
	document.addEventListener('fullscreenchange', scheduleResize);
	if (typeof ResizeObserver !== 'undefined') {
		new ResizeObserver(scheduleResize).observe(canvas);
	}

	// Polling fallback: catches ancestor CSS transform/zoom changes (e.g. a
	// portal resizing its iframe with `transform: scale()`), which don't
	// necessarily fire a resize event or trigger ResizeObserver on their own.
	setInterval(scheduleResize, 250);
}());
// ----------------------------------------------------------------------------

// --- WebGL context-loss recovery/logging -----------------------------------
// Desktop WebGL runs across a far wider range of GPUs/drivers than mobile
// (old integrated Intel graphics, outdated Nvidia/AMD drivers, VMs/remote
// desktops), and a lost GPU context otherwise just freezes the canvas with
// no error the player (or CrazyGames' crash reporting) can act on. This
// logs it clearly and gives the browser a few seconds to auto-restore the
// context before falling back to a full reload, which is strictly better
// than a silently frozen game.
(function () {
	const canvas = document.getElementById('canvas');
	let reloadTimer = null;

	canvas.addEventListener('webglcontextlost', function (event) {
		// Without preventDefault() the browser won't even attempt to
		// restore the context.
		event.preventDefault();
		console.error('[Numberwire] WebGL context lost. Waiting for the browser to restore it...');
		reloadTimer = setTimeout(function () {
			console.error('[Numberwire] WebGL context was not restored in time; reloading.');
			window.location.reload();
		}, 3000);
	}, false);

	canvas.addEventListener('webglcontextrestored', function () {
		console.warn('[Numberwire] WebGL context restored.');
		if (reloadTimer !== null) {
			clearTimeout(reloadTimer);
			reloadTimer = null;
		}
	}, false);
}());
// ----------------------------------------------------------------------------

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	let initializing = true;
	let statusMode = '';
	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}
	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}
	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}
	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
